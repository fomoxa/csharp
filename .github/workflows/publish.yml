name: Publish to NuGet

on:
  push:
    tags:
      - "net-v*.*.*"
      - "reliability-v*.*.*"
  workflow_dispatch:
    inputs:
      package:
        description: "Which package to pack and push"
        type: choice
        options:
          - net
          - reliability
          - all
        default: all

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # required for NuGet Trusted Publishing (OIDC)
      contents: read

    steps:
      - uses: actions/checkout@v4

      # A tag names exactly one package to release (net-v*.*.* or
      # reliability-v*.*.*) so that bumping one package never forces a
      # release-looking tag on the other. workflow_dispatch picks the target
      # explicitly instead, defaulting to both.
      - name: Determine target package
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "package=${{ github.event.inputs.package }}" >> "$GITHUB_OUTPUT"
          else
            ref="${GITHUB_REF#refs/tags/}"
            case "$ref" in
              net-v*) echo "package=net" >> "$GITHUB_OUTPUT" ;;
              reliability-v*) echo "package=reliability" >> "$GITHUB_OUTPUT" ;;
              *)
                echo "::error::tag '$ref' matches neither net-v*.*.* nor reliability-v*.*.*"
                exit 1
                ;;
            esac
          fi

      # <Version> in each .csproj is a hand-maintained constant, not derived
      # from the tag. An unchanged version on the package NOT targeted by this
      # release is normal and must not block it. It is still worth surfacing
      # loudly for the targeted package(s): --skip-duplicate further down
      # would otherwise no-op a forgotten bump silently.
      - name: Warn about versions already on NuGet
        run: |
          set -euo pipefail
          check() {
            csproj="$1"
            id=$(grep -oPm1 '(?<=<PackageId>)[^<]+' "$csproj")
            version=$(grep -oPm1 '(?<=<Version>)[^<]+' "$csproj")
            lower_id=$(echo "$id" | tr '[:upper:]' '[:lower:]')
            url="https://api.nuget.org/v3-flatcontainer/${lower_id}/${version}/${lower_id}.nuspec"
            status=$(curl -s -o /dev/null -w "%{http_code}" "$url")
            if [ "$status" = "200" ]; then
              echo "::warning file=$csproj::$id $version is already published on NuGet - this package's publish step will be a no-op. Bump <Version> in $csproj first if this release was meant to include it."
            else
              echo "$id $version is not yet published - this release will publish it."
            fi
          }

          package="${{ steps.target.outputs.package }}"
          if [ "$package" = "net" ] || [ "$package" = "all" ]; then
            check src/Fomoxa.Net/Fomoxa.Net.csproj
          fi
          if [ "$package" = "reliability" ] || [ "$package" = "all" ]; then
            check src/Fomoxa.Reliability/Fomoxa.Reliability.csproj
          fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet build Fomoxa.Net.sln -c Release

      - name: Test
        run: |
          dotnet run --project tests/Fomoxa.Net.Tests/Fomoxa.Net.Tests.csproj -c Release --no-build
          dotnet run --project tests/Fomoxa.Reliability.Tests/Fomoxa.Reliability.Tests.csproj -c Release --no-build

      - name: Pack
        run: |
          package="${{ steps.target.outputs.package }}"
          if [ "$package" = "net" ] || [ "$package" = "all" ]; then
            dotnet pack src/Fomoxa.Net/Fomoxa.Net.csproj -c Release -o artifacts
          fi
          if [ "$package" = "reliability" ] || [ "$package" = "all" ]; then
            dotnet pack src/Fomoxa.Reliability/Fomoxa.Reliability.csproj -c Release -o artifacts
          fi

      # Exchanges a short-lived GitHub OIDC token for a temporary nuget.org
      # API key (valid 1 hour). No long-lived secret is stored anywhere.
      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: NuGet push
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
